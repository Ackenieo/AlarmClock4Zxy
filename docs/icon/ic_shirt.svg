<?xml version="1.0" encoding="UTF-8"?>
<!-- 皮肤市场入口图标：T 恤（线稿风格，24×24 网格，描边 1.7）
     描边色 #F5F5F7 为浅色占位，实际使用由 android:tint 覆盖 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#F5F5F7" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- 衣身 + 两侧短袖（一笔连通，领口处留空由下面的领弧补上） -->
  <path d="M8.8 3.8 5.4 5 2.9 8.9 6.1 10.7 7.3 9.2 7.3 20.5 16.7 20.5 16.7 9.2 17.9 10.7 21.1 8.9 18.6 5 15.2 3.8"/>
  <!-- 领口弧线 -->
  <path d="M8.8 3.8c.4 2.4 1.6 3.4 3.2 3.4s2.8-1 3.2-3.4"/>
</svg>
